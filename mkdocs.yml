# The documentation site (GitHub Pages, .github/workflows/docs.yml). Build locally:
#   pip install -r tools/site/requirements.txt && mkdocs build --strict   (output in site/, not committed)
# tools/site/hooks.py splits docs/API.md into a page per type and adds UI.md at build time.
site_name: UnderRailWorks
site_description: Engine upgrade and mod framework for UnderRail - modding API and guides
repo_url: https://github.com/Rhiyo/UnderRailWorks
repo_name: Rhiyo/UnderRailWorks
edit_uri: ""
docs_dir: docs

hooks:
  - tools/site/hooks.py

theme:
  name: material
  features:
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - Modding guide: ModdingGuide.md
  - Cookbook: Cookbook.md
  - Drawing: Drawing.md
  - Multiplayer: Multiplayer.md
  - Versions & API stability: Versioning.md
  - UI rules: UI.md
  - API reference: api/index.md
